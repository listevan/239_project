[project]
name = "tool-atrophy-pilot"
version = "0.1.0"
description = "Does RL with a code interpreter erode tool-free reasoning? vLLM harness (Colab), grading and report (laptop)."
requires-python = ">=3.11"
dependencies = [
    "math-verify>=0.8",
    "numpy",
    "pandas",
    "matplotlib",
]

[dependency-groups]
dev = [
    "nbformat",
]                                     # tools/build_notebook.py
gpu = ["vllm>=0.10", "datasets>=3.0"]   # generation; the Colab notebook installs these itself

[tool.uv]
package = false
